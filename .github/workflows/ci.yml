name: CI

# Verifies every push and pull request. Builds nothing shippable — see release.yml for that.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request supersedes the run in flight. Anything else is grouped by
# its commit, so every commit on main keeps its own verdict: one shared group would let a
# third push cancel the second while it waits behind the first.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wrapper:
    name: Gradle wrapper
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v7

      # Fails if gradle-wrapper.jar does not match a hash Gradle published, so a tampered
      # wrapper cannot ride along in a dependency PR. Every job that runs ./gradlew waits on
      # this one, so an unverified wrapper never executes on the runner.
      - uses: gradle/actions/wrapper-validation@v6

  # A change that touches only documentation skips the build jobs. They are skipped rather
  # than never triggered, because a skipped job still satisfies a required status check and
  # a workflow filtered out by `paths-ignore` leaves the check waiting forever.
  changes:
    name: Changes
    runs-on: [self-hosted, Linux, X64]
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A manual run has no base and a new branch's is all zeros: build everything.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo code=true >>"$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...$GITHUB_SHA" | grep -qvE '\.md$|^docs/|^LICENSE$'; then
            echo code=true >>"$GITHUB_OUTPUT"
          else
            echo code=false >>"$GITHUB_OUTPUT"
          fi

  core:
    name: Core tests
    needs: [wrapper, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Test on the JVM
        run: ./gradlew :core:test

      # The runner's gate: the real launcher against a loopback server. A deliberately
      # failing assertion has to exit non-zero, or CI would pass on a broken collection.
      - name: Run the sample collections
        run: ./gradlew :core:installDist && tools/sample-run.sh core/build/install/ping-core/bin/ping-core

  core-cross-os:
    name: Core tests (${{ matrix.os }})
    # Platform paths and filesystem behaviour move slowly, and a macOS runner is one of the
    # expensive parts of CI, so this runs after merge rather than on every pull request. Windows
    # is deliberately not part of this job.
    needs: [wrapper, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Test on the JVM
        run: ./gradlew :core:test

  native:
    name: Native compatibility
    needs: [wrapper, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v7

      # The gate that matters: the same suite compiled the way the core ships. Catches
      # reflection that works on the JVM and is missing from the reachability metadata.
      # One OS is enough here; the per-OS native build is a release concern (release.yml).
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: gradle
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test as a native image
        run: ./gradlew :core:nativeTest

      - name: Run the sample collections as a native image
        run: ./gradlew :core:nativeCompile && tools/sample-run.sh core/build/native/nativeCompile/ping-core

  desktop:
    name: Desktop
    needs: [wrapper, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # The smoke test drives the real app over CDP, and the app spawns the core. In
      # development that is the JVM launcher `installDist` writes, so it has to exist before
      # the run; without it the app opens but every store call fails and the tree never loads.
      - run: ./gradlew :core:installDist

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
        working-directory: desktop

      # esbuild strips types without checking them, so this is the only gate on the
      # renderer's TypeScript and Svelte components.
      - run: npm run check
        working-directory: desktop

      # The macOS updater verifies its own downloads instead of relying on an Apple
      # signature, so the checks that decide what may be installed are unit tested.
      - run: npm test
        working-directory: desktop

      - run: npm run build
        working-directory: desktop

      # Drives the built app over CDP. Offline so the run does not depend on a third-party
      # API; the live HTTPS path stays a local-only step. xvfb gives Electron a display.
      - name: UI smoke test
        run: xvfb-run -a npm run smoke
        working-directory: desktop
        env:
          PING_SMOKE_OFFLINE: '1'
