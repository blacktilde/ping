name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # native-image cannot cross-compile, so every target OS builds its own binary.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: gradle
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test on the JVM
        run: ./gradlew :core:test

      # The gate that matters: the same suite, compiled the way the core ships. Catches
      # reflection that works on the JVM and is missing from the reachability metadata.
      - name: Test as a native image
        run: ./gradlew :core:nativeTest

      - name: Build the native core
        run: ./gradlew :core:nativeCompile

      - uses: actions/upload-artifact@v4
        with:
          name: ping-core-${{ matrix.os }}
          path: |
            core/build/native/nativeCompile/ping-core
            core/build/native/nativeCompile/ping-core.exe
          if-no-files-found: error

  desktop:
    name: Desktop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
        working-directory: desktop

      - run: npm run build
        working-directory: desktop
