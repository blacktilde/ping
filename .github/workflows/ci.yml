name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wrapper:
    name: Gradle wrapper
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

  changes:
    name: Changes
    runs-on: [self-hosted, Linux, X64]
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo code=true >>"$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...$GITHUB_SHA" | grep -qvE '\.md$|^docs/|^LICENSE$'; then
            echo code=true >>"$GITHUB_OUTPUT"
          else
            echo code=false >>"$GITHUB_OUTPUT"
          fi

  core:
    name: Core tests
    needs: [wrapper, changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Require a verified Gradle wrapper
        if: needs.wrapper.result != 'success'
        run: |
          echo "Gradle wrapper validation did not pass." >&2
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Test on the JVM
        run: ./gradlew :core:test

      - name: Run the sample collections
        run: ./gradlew :core:installDist && tools/sample-run.sh core/build/install/ping-core/bin/ping-core

  core-cross-os:
    name: Core tests (${{ matrix.os }})
    needs: [wrapper, changes]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - name: Require a verified Gradle wrapper
        if: needs.wrapper.result != 'success'
        run: |
          echo "Gradle wrapper validation did not pass." >&2
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Test on the JVM
        run: ./gradlew :core:test

  native:
    name: Native compatibility
    needs: [wrapper, changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Require a verified Gradle wrapper
        if: needs.wrapper.result != 'success'
        run: |
          echo "Gradle wrapper validation did not pass." >&2
          exit 1

      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test as a native image
        run: ./gradlew :core:nativeTest

      - name: Run the sample collections as a native image
        run: ./gradlew :core:nativeCompile && tools/sample-run.sh core/build/native/nativeCompile/ping-core

  desktop:
    name: Desktop
    needs: [wrapper, changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Require a verified Gradle wrapper
        if: needs.wrapper.result != 'success'
        run: |
          echo "Gradle wrapper validation did not pass." >&2
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - run: ./gradlew :core:installDist

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
        working-directory: desktop

      - run: npm run check
        working-directory: desktop

      - run: npm test
        working-directory: desktop

      - run: npm run build
        working-directory: desktop

      - name: UI smoke test
        run: xvfb-run -a npm run smoke
        working-directory: desktop
        env:
          PING_SMOKE_OFFLINE: '1'
