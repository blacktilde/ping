name: CI

# Verifies every push and pull request. Builds nothing shippable — see release.yml for that.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  wrapper:
    name: Gradle wrapper
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Fails if gradle-wrapper.jar does not match a hash Gradle published, so a tampered
      # wrapper cannot ride along in a dependency PR.
      - uses: gradle/actions/wrapper-validation@v6

  core:
    name: Core tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Test on the JVM
        run: ./gradlew :core:test

  core-cross-os:
    name: Core tests (${{ matrix.os }})
    # Platform paths and filesystem behaviour move slowly, and a macOS/Windows runner pair is
    # the expensive part of CI, so this runs after merge rather than on every pull request.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Test on the JVM
        run: ./gradlew :core:test

  native:
    name: Native compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The gate that matters: the same suite compiled the way the core ships. Catches
      # reflection that works on the JVM and is missing from the reachability metadata.
      # One OS is enough here; the per-OS native build is a release concern (release.yml).
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: gradle
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test as a native image
        run: ./gradlew :core:nativeTest

  desktop:
    name: Desktop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # The smoke test drives the real app over CDP, and the app spawns the core. In
      # development that is the JVM launcher `installDist` writes, so it has to exist before
      # the run; without it the app opens but every store call fails and the tree never loads.
      - run: ./gradlew :core:installDist

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
        working-directory: desktop

      # esbuild strips types without checking them, so this is the only gate on the
      # renderer's TypeScript and Svelte components.
      - run: npm run check
        working-directory: desktop

      - run: npm run build
        working-directory: desktop

      # Drives the built app over CDP. Offline so the run does not depend on a third-party
      # API; the live HTTPS path stays a local-only step. xvfb gives Electron a display.
      - name: UI smoke test
        run: xvfb-run -a npm run smoke
        working-directory: desktop
        env:
          PING_SMOKE_OFFLINE: '1'
