name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft'
        required: false
        default: false
        type: boolean

jobs:
  core:
    name: Native core (${{ matrix.os }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: '["self-hosted", "Linux", "X64"]'
          - os: macos-latest
            runner: '["macos-latest"]'
          - os: windows-latest
            runner: '["windows-latest"]'

    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: gradle
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the native core
        shell: bash
        run: ./gradlew :core:nativeCompile "-PappVersion=${TAG#v}"
        env:
          TAG: ${{ inputs.tag }}

      - uses: actions/upload-artifact@v7
        with:
          name: ping-core-${{ matrix.os }}
          path: |
            core/build/native/nativeCompile/ping-core
            core/build/native/nativeCompile/ping-core.exe
          if-no-files-found: error

  package:
    name: Package (${{ matrix.os }})
    needs: core
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: '["self-hosted", "Linux", "X64"]'
          - os: macos-latest
            runner: '["macos-latest"]'
          - os: windows-latest
            runner: '["windows-latest"]'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: ping-core-${{ matrix.os }}
          path: core/build/native/nativeCompile

      - name: Make the core executable
        if: runner.os != 'Windows'
        working-directory: core/build/native/nativeCompile
        run: chmod +x ping-core

      - run: npm ci
        working-directory: desktop

      - name: Set version from the tag
        shell: bash
        working-directory: desktop
        run: |
          tag="${{ inputs.tag }}"
          npm version "${tag#v}" --no-git-tag-version --allow-same-version

      - run: npm run build
        working-directory: desktop

      # A macOS build verifies updates against the key compiled into it. Ship one that still
      # holds the placeholder and every install reports an error instead of updating, so the
      # release stops here rather than there.
      - name: Check the macOS update signing key is set
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if grep -q REPLACE_WITH_THE_RELEASE_SIGNING_PUBLIC_KEY desktop/src/main/mac-update.ts; then
            echo "desktop/src/main/mac-update.ts still holds the placeholder public key." >&2
            echo "Run tools/mac-update-keygen.sh, commit the public half, and store the private half as MAC_UPDATE_SIGNING_KEY." >&2
            exit 1
          fi

      - name: Package
        run: npx electron-builder --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The macOS update feed. These builds carry no Apple Developer ID, so Squirrel.Mac
      # cannot install them and the app updates itself instead — against this signature
      # rather than Apple's. Without the secret the step fails the release, which is the
      # point: a feed nobody signed is one the app will refuse.
      - name: Sign the macOS update manifest
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          node tools/mac-manifest.mjs desktop/dist "${tag#v}" "$tag"
        env:
          MAC_UPDATE_SIGNING_KEY: ${{ secrets.MAC_UPDATE_SIGNING_KEY }}

      - uses: actions/upload-artifact@v7
        with:
          name: ping-dist-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/latest-mac.json
            desktop/dist/*.blockmap
          if-no-files-found: warn

  release:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ping-dist-*
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: installers/*
          draft: ${{ inputs.draft }}
          generate_release_notes: true
