name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 (a missing v is added)'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  tag:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.normalize.outputs.tag }}

    steps:
      - id: normalize
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          TAG="v${TAG#v}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$TAG' is not of the form v1.2.3 or v1.2.3-beta.1." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  core:
    name: Native core (${{ matrix.os }})
    needs: tag
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: '["self-hosted", "Linux", "X64"]'
          - os: macos-latest
            runner: '["macos-latest"]'
          - os: windows-latest
            runner: '["windows-latest"]'

    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: gradle
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the native core
        shell: bash
        run: ./gradlew :core:nativeCompile "-PappVersion=${TAG#v}"
        env:
          TAG: ${{ needs.tag.outputs.tag }}

      - uses: actions/upload-artifact@v7
        with:
          name: ping-core-${{ matrix.os }}
          path: |
            core/build/native/nativeCompile/ping-core
            core/build/native/nativeCompile/ping-core.exe
          if-no-files-found: error

  package:
    name: Package (${{ matrix.os }})
    needs: [tag, core]
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: '["self-hosted", "Linux", "X64"]'
          - os: macos-latest
            runner: '["macos-latest"]'
          - os: windows-latest
            runner: '["windows-latest"]'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: ping-core-${{ matrix.os }}
          path: core/build/native/nativeCompile

      - name: Make the core executable
        if: runner.os != 'Windows'
        working-directory: core/build/native/nativeCompile
        run: chmod +x ping-core

      - run: npm ci
        working-directory: desktop

      - name: Set version from the tag
        shell: bash
        working-directory: desktop
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
        env:
          TAG: ${{ needs.tag.outputs.tag }}

      - run: npm run build
        working-directory: desktop

      - name: Package
        run: npx electron-builder --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check no installer name carries a space
        shell: bash
        working-directory: desktop/dist
        run: |
          status=0
          for path in *" "*; do
            [ -e "$path" ] || continue
            echo "$path has a space in its name, which the update feed cannot resolve." >&2
            status=1
          done
          exit $status

      - name: Sign the macOS update manifest
        if: runner.os == 'macOS'
        shell: bash
        run: node tools/mac-manifest.mjs desktop/dist "${TAG#v}" "$TAG"
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          MAC_UPDATE_SIGNING_KEY: ${{ secrets.MAC_UPDATE_SIGNING_KEY }}

      - uses: actions/upload-artifact@v7
        with:
          name: ping-dist-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/latest*.yml
            desktop/dist/latest-mac.json
            desktop/dist/*.blockmap
          if-no-files-found: error

  release:
    name: Publish
    needs: [tag, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ping-dist-*
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: installers/*
          draft: ${{ inputs.draft }}
          generate_release_notes: true
