name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft'
        required: false
        default: false
        type: boolean

jobs:
  core:
    name: Native core (${{ matrix.os }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: '["self-hosted", "Linux", "X64"]'
          - os: macos-latest
            runner: '["macos-latest"]'
          - os: windows-latest
            runner: '["windows-latest"]'

    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: gradle
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the native core
        shell: bash
        run: ./gradlew :core:nativeCompile "-PappVersion=${TAG#v}"
        env:
          TAG: ${{ inputs.tag }}

      - uses: actions/upload-artifact@v7
        with:
          name: ping-core-${{ matrix.os }}
          path: |
            core/build/native/nativeCompile/ping-core
            core/build/native/nativeCompile/ping-core.exe
          if-no-files-found: error

  package:
    name: Package (${{ matrix.os }})
    needs: core
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: '["self-hosted", "Linux", "X64"]'
          - os: macos-latest
            runner: '["macos-latest"]'
          - os: windows-latest
            runner: '["windows-latest"]'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: ping-core-${{ matrix.os }}
          path: core/build/native/nativeCompile

      - name: Make the core executable
        if: runner.os != 'Windows'
        working-directory: core/build/native/nativeCompile
        run: chmod +x ping-core

      - run: npm ci
        working-directory: desktop

      - name: Set version from the tag
        shell: bash
        working-directory: desktop
        run: |
          tag="${{ inputs.tag }}"
          npm version "${tag#v}" --no-git-tag-version --allow-same-version

      - run: npm run build
        working-directory: desktop

      - name: Package
        run: npx electron-builder --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: ping-dist-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: warn

  release:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ping-dist-*
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: installers/*
          draft: ${{ inputs.draft }}
          generate_release_notes: true
