name: Release

# Manual only, so a small change does not rebuild installers for every OS. Run it after CI is
# green, with the tag the release should carry; the tag is created if it does not exist.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft'
        required: false
        default: false
        type: boolean

jobs:
  core:
    name: Native core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # native-image cannot cross-compile, so every target OS builds its own binary.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: gradle
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the native core
        run: ./gradlew :core:nativeCompile

      - uses: actions/upload-artifact@v4
        with:
          name: ping-core-${{ matrix.os }}
          path: |
            core/build/native/nativeCompile/ping-core
            core/build/native/nativeCompile/ping-core.exe
          if-no-files-found: error

  package:
    name: Package (${{ matrix.os }})
    needs: core
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: ping-core-${{ matrix.os }}
          path: core/build/native/nativeCompile

      - run: npm ci
        working-directory: desktop

      - run: npm run build
        working-directory: desktop

      # The version comes from the tag, so the installer names and the latest*.yml update
      # metadata agree with the release the updater will compare against.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Unsigned by default. A signed release supplies CSC_LINK / CSC_KEY_PASSWORD and the
      # Apple credentials; electron-builder picks them up without a config change.
      - name: Package
        run: npx electron-builder --publish never -c.extraMetadata.version=${{ steps.version.outputs.version }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: ping-dist-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: warn

  release:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ping-dist-*
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: installers/*
          draft: ${{ inputs.draft }}
          generate_release_notes: true
