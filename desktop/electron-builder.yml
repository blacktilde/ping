# Packaging for the Electron shell plus the native core it spawns.
#
# electron-vite writes the shell to out/. The core travels beside the app, not inside the
# asar, because the main process spawns it and needs a real executable at
# resources/core/ping-core — the path `resolveCoreBinary` looks for.
appId: dev.ping.desktop
productName: Ping
copyright: Copyright © 2026 Ping contributors

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  - from: ../core/build/native/nativeCompile
    to: core
    filter:
      - ping-core
      - ping-core.exe

asar: true
# No native node modules to rebuild; electron-builder's default would only slow the build.
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization turns on when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are
  # present; the default keeps an unsigned CI build from failing.
  notarize: false
  target:
    - dmg
    - zip

win:
  # The installer's name has to survive the round trip through a GitHub release. GitHub stores
  # an uploaded asset's spaces as dots, while electron-updater rewrites them as hyphens when it
  # resolves a url from the feed, so electron-builder's default `Ping Setup 0.1.9.exe` is asked
  # for as `Ping-Setup-0.1.9.exe` and served as `Ping.Setup.0.1.9.exe` — a 404 in the update
  # dialog. A name with no spaces is the same on both sides. No other target's default has one.
  artifactName: ${productName}-Setup-${version}.${ext}
  target:
    - nsis

linux:
  executableName: ping
  category: Development
  maintainer: Ping contributors
  # Match the installed .desktop filename to Electron's app_id/WM_CLASS (package.json
  # `desktopName`), so a desktop environment links the running window to its launcher entry.
  syncDesktopName: true
  target:
    - AppImage
    - deb

# The update feed. electron-updater reads these release assets over plain HTTPS, so the feed
# must be a public repository this project controls, and dbohry/ping is. The app never
# installs an update without asking — see `startUpdater` in the main process.
publish:
  provider: github
  owner: dbohry
  repo: ping
