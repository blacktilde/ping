[package]
name = "ping-shell"
version = "0.0.6"
description = "Ping desktop shell on Tauri (spike: see docs/PLAN.md phase 30)"
edition = "2021"
publish = false

[lib]
name = "ping_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
